{name: Public data refresh and Pages deployment,
 on: {push: {branches: [main]}, workflow_dispatch: {}, schedule: [{cron: '17 1,7,13,19 * * *'}]},
  permissions: {contents: write},
   concurrency: {group: olpark-pages, cancel-in-progress: false},
    jobs: {
      refresh-build: {runs-on: ubuntu-latest, steps: [
         {uses: actions/checkout@v4},
            {uses: actions/setup-python@v5, with: {python-version: '3.12'}},
               {name: Refresh public snapshot and build site, run: bash scripts/ci_build.sh},
                  {uses: actions/configure-pages@v5},
                     {uses: actions/upload-pages-artifact@v3, with: {path: dist}}]},  deploy: {needs: refresh-build, runs-on: ubuntu-latest,
                        permissions: {pages: write, id-token: write, actions: read},
                           environment: {name: github-pages, url: '${{ steps.deployment.outputs.page_url }}'},
                              steps: [
                                  {name: Wait until the github-pages artifact is indexed,
                                       env: {GH_TOKEN: '${{ github.token }}'},
                                            run: "for i in $(seq 12); do\n  n=$(gh api \"repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?name=github-pages\" --jq .total_count)\n  [ \"$n\" -ge 1 ] && exit 0\n  sleep 5\ndone\nexit 1"},
                                                {id: deployment, uses: actions/deploy-pages@v5}]}}}
